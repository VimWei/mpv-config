# touch.lua options

# --- Swipe Gesture Options ---

# Enable swipe gestures on video area (yes/no)
gesture_enabled=yes

# Deadzone in pixels before gesture activates
gesture_deadzone=50

# Seek sensitivity multiplier (1.0 = natural)
gesture_seek_scale=1.0

# Playback speed range for vertical swipe
gesture_speed_min=0.1
gesture_speed_max=5.0

# Seconds to wait after drag stops before exact seek (precision correction)
gesture_seek_exact_delay=0.05

# --- Tap Zone Options ---

# Tap zone boundaries (fraction of screen width)
# Left zone: 0 to tap_zone_left
# Center zone: tap_zone_left to tap_zone_right
# Right zone: tap_zone_right to 1.0
tap_zone_left=0.20
tap_zone_right=0.80

# Seek amount when no subtitles (seconds) for left/right tap zones
tap_seek_no_sub=5
